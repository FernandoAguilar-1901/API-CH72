<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce - Home</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/common.css">

    <!-- CSS propio (se agregará en fase 3) -->
    <link rel="stylesheet" href="./css/home.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Generation Ecommerce</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="navLinks">
                    <!-- Estado sin sesión -->
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Log In</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="signin.html">Sign In</a>
                    </li>

                    <!--
                Estado con sesión (se alterna vía JS, se deja comentado como referencia):
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="gestion.html">Gestión</a>
                </li>
                <li class="nav-item">
                    <button class="btn btn-outline-danger ms-2" id="logoutBtn">Log Out</button>
                </li>
                -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container mt-4">

        <h1 class="mb-4">Catálogo</h1>

        <!-- TOGGLE DE VISTA -->
        <div class="btn-group mb-4" role="group" aria-label="Selector de vista" id="viewToggle">
            <button type="button" class="btn btn-primary" id="btnShowProductos">Productos</button>
            <button type="button" class="btn btn-outline-primary" id="btnShowCategorias">Categorías</button>
            <button type="button" class="btn btn-outline-primary" id="btnShowUsuarios">Usuarios</button>
        </div>

        <!-- MENSAJE DE ACCESO RESTRINGIDO (para Usuarios sin token) -->
        <div class="alert alert-warning d-none" id="usuariosRestringidoMsg">
            Debes iniciar sesión para ver los usuarios registrados.
        </div>

        <!-- VISTA: PRODUCTOS -->
        <section id="vistaProductos">
            <div class="row" id="productosContainer">

                <!-- Tarjeta de producto (ejemplo estructural, se generará dinámicamente con JS) -->
                <div class="col-md-4 mb-4">
                    <div class="card h-100">
                        <img src="" class="card-img-top" alt="Nombre del producto">
                        <div class="card-body">
                            <h5 class="card-title">Nombre del producto</h5>
                            <p class="card-text">Descripción del producto</p>
                            <p class="card-text fw-bold">$Precio</p>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- VISTA: CATEGORÍAS -->
        <section id="vistaCategorias" class="d-none">
            <div class="row" id="categoriasContainer">

                <!-- Tarjeta de categoría (ejemplo estructural) -->
                <div class="col-md-4 mb-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">Nombre de la categoría</h5>
                            <p class="card-text">Descripción de la categoría</p>
                            <p class="card-text"><small class="text-muted">X productos en esta categoría</small></p>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- VISTA: USUARIOS -->
        <section id="vistaUsuarios" class="d-none">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Email</th>
                    </tr>
                </thead>
                <tbody id="usuariosTableBody">
                    <!-- Filas generadas dinámicamente con JS -->
                    <tr>
                        <td>1</td>
                        <td>ejemplo@generation.com</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS propio (se agregará en fase 2) -->
    <script src="./js/home.js"></script>

</body>

</html>
