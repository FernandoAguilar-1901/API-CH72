<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce - Log In</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/common.css">

    <!-- CSS propio (se agregará en fase 3) -->
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Generation Ecommerce</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="navLinks">
                    <!-- Estado sin sesión -->
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="login.html">Log In</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="signin.html">Sign In</a>
                    </li>

                    <!--
                Estado con sesión (se alterna vía JS, se deja comentado como referencia):
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="gestion.html">Gestión</a>
                </li>
                <li class="nav-item">
                    <button class="btn btn-outline-danger ms-2" id="logoutBtn">Log Out</button>
                </li>
                -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container mt-4">

        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">

                <h1 class="mb-4 text-center">Log In</h1>

                <!-- MENSAJE DE ERROR (oculto por default) -->
                <div class="alert alert-danger d-none" id="loginErrorMsg" role="alert">
                    Credenciales inválidas. Intenta de nuevo.
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="loginEmail" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="loginPass" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="loginPass" name="pass" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </form>

                <p class="text-center mt-3">
                    ¿No tienes cuenta? <a href="signin.html">Regístrate aquí</a>
                </p>

            </div>
        </div>

    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS propio (se agregará en fase 2) -->
    <script src="./js/login.js"></script>

</body>

</html>
